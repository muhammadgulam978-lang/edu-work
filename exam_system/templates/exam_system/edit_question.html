{% extends "teacher_dashboard/base.html" %}
{% comment %}SAVE AS: exam_system/edit_question.html{% endcomment %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'question_bank_detail' question.bank.id %}" class="btn btn-outline-secondary btn-sm mr-3">
            <i class="fa fa-arrow-left"></i>
        </a>
        <h3 class="mb-0">Edit Question</h3>
    </div>
    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ request.GET.next }}">

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label>Difficulty</label>
                                <select name="difficulty" class="form-control">
                                    {% for val, label in difficulties %}
                                        <option value="{{ val }}" {% if question.difficulty == val %}selected{% endif %}>
                                            {{ label }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label>Marks</label>
                                <input type="number" name="marks" class="form-control"
                                       value="{{ question.marks }}" min="1">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Question Text <span class="text-danger">*</span></label>
                            <textarea name="text" class="form-control" rows="3" required>{{ question.text }}</textarea>
                        </div>

                        {% if question.option_a is not None %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Option A</label>
                                    <input type="text" name="option_a" class="form-control" value="{{ question.option_a }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Option B</label>
                                    <input type="text" name="option_b" class="form-control" value="{{ question.option_b }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Option C</label>
                                    <input type="text" name="option_c" class="form-control" value="{{ question.option_c }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Option D</label>
                                    <input type="text" name="option_d" class="form-control" value="{{ question.option_d }}">
                                </div>
                            </div>
                        </div>
                        {% endif %}

                        <div class="form-group">
                            <label>Correct Answer / Model Answer</label>
                            <textarea name="correct_answer" class="form-control" rows="2">{{ question.correct_answer }}</textarea>
                        </div>

                        <div class="d-flex justify-content-end">
                            <a href="{% url 'question_bank_detail' question.bank.id %}" class="btn btn-outline-secondary mr-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-save mr-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
