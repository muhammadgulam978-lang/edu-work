{% extends "admin_panel/bases.html" %}
{% load static %}
{% block title %}Log Emergency{% endblock %}
{% block head %}<link rel="stylesheet" href="{% static 'health_management/css/health_theme.css' %}">{% endblock %}
{% block content %}
<div class="hlm-wrap">
  <div class="hlm-form-card" style="max-width:920px;">
    <h2>🚑 Log Medical Emergency</h2>
    <form method="post">
      {% csrf_token %}
      {% include "health_management/_form_fields.html" %}
      <div class="hlm-form-actions">
        <button type="submit" class="btn btn-red">Create Emergency Case</button>
        <a class="btn btn-cancel" href="{% url 'health_management:emergency_case_list' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
