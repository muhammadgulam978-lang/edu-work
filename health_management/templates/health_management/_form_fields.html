{% load static %}
<div class="hlm-form-grid">
  {% for field in form %}
    <div class="hlm-field {% if field.field.widget.input_type == 'checkbox' %}hlm-checkbox{% endif %}">
      {% if field.field.widget.input_type != 'checkbox' %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>{% endif %}
      {{ field }}
      {% if field.field.widget.input_type == 'checkbox' %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{% endif %}
      {% if field.errors %}<div class="hlm-field-error" style="color:#a1373e;font-size:12px;">{{ field.errors|striptags }}</div>{% endif %}
    </div>
  {% endfor %}
</div>
