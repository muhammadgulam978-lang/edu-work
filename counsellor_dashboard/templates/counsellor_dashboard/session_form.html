{% extends "admin_panel/bases.html" %}
{% load static %}
{% block title %}Add Session Note{% endblock %}
{% block head %}<link rel="stylesheet" href="{% static 'counsellor_dashboard/css/counsellor_theme.css' %}">{% endblock %}
{% block content %}
<div class="cns-wrap">
  <div class="cns-form-card cns-wide">
    <h2>📝 Add Session Note — {{ case.case_number }}</h2>
    <form method="post">
      {% csrf_token %}
      {% include "counsellor_dashboard/_form_fields.html" %}
      <div class="cns-form-actions">
        <button type="submit" class="btn btn-teal">Save Session Note</button>
        <a class="btn btn-cancel" href="{% url 'counsellor_dashboard:case_detail' case.id %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
